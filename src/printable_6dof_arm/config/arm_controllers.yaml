controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1_base_yaw
      - joint2_shoulder_pitch
      - joint3_elbow_pitch
      - joint4_wrist_pitch
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      joint1_base_yaw: {trajectory: 0.35, goal: 0.15}
      joint2_shoulder_pitch: {trajectory: 0.12, goal: 0.05}
      joint3_elbow_pitch: {trajectory: 0.12, goal: 0.05}
      joint4_wrist_pitch: {trajectory: 0.12, goal: 0.05}

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      # A grasp stops the revolute CAD jaws against the object.
      left_finger_joint: {trajectory: 0.30, goal: 0.30}
      right_finger_joint: {trajectory: 0.30, goal: 0.30}
